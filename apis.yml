aid: boosted
name: Boosted.ai
description: >-
  Boosted.ai is an agentic AI platform purpose-built for the financial services
  and investment management industry. Its Alfa product gives portfolio managers,
  analysts, and wealth and institutional platforms conversational financial chat
  and autonomous investment agents that automate research, market monitoring,
  idea generation, and reporting over verified, financial-grade data. Boosted.ai
  exposes these capabilities to developers through an API, SDK, and embeddable UI
  so platforms can deliver an investing assistant, an insights feed of
  agent-generated research, and custom compliant agents inside their own products.
  The company reports serving 300+ global clients managing $5T+ in assets and is
  headquartered in New York, with offices in Toronto and San Francisco.
